{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card border-danger">
            <div class="card-body">
                <h1 class="display-1 text-danger mb-4">💀</h1>
                <h2 class="card-title text-danger mb-4">{{ message }}</h2>
                <p class="text-muted">Well, {{ name }}, that's what you get! 😄</p>
                <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">Try Again</a>
                <a href="{{ url_for('demo') }}" class="btn btn-outline-primary mt-3 ms-2">See Demo</a>
            </div>
        </div>
    </div>
</div>

<style>
.display-1 {
    font-size: 5rem;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
    }
    40% {
        transform: translateY(-30px);
    }
    60% {
        transform: translateY(-15px);
    }
}
</style>
{% endblock %}
